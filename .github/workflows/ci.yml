name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-e-renderizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      S: skills/grifo/scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright pillow matplotlib
          python -m playwright install --with-deps chromium

      - name: Verificadores
        run: |
          python ferramentas/verificar_ilustracoes.py
          python ferramentas/test_montar.py
          python ferramentas/test_figura.py
          python ferramentas/verificar_contraste.py
          python $S/verificar.py exemplos/*-fonte.html skills/grifo/assets/templates/*.html

      - name: Montar e renderizar exemplos (falha em estouro de layout)
        run: |
          mkdir -p saida
          falhou=0
          for f in exemplos/*-fonte.html; do
            html="saida/$(basename "${f%-fonte.html}").html"
            python $S/montar.py "$f" "$html"
            python $S/renderizar.py "$html" saida --json > "${html%.html}.json"
            python - "${html%.html}.json" <<'PY' || falhou=1
          import json, sys
          rel = json.load(open(sys.argv[1], encoding="utf-8"))
          estouro = {"pagina", "lateral", "transborda"}
          for a in rel["avisos"]:
              nivel = "error" if a["tipo"] in estouro else "warning"
              print(f"::{nivel}::{rel['arquivo']} folha {a['folha']} [{a['tipo']}] {a['elemento'] or ''} {a['msg']}")
          print(f"{rel['arquivo']}: {rel['folhas']} folha(s), {len(rel['avisos'])} aviso(s)")
          sys.exit(any(a["tipo"] in estouro for a in rel["avisos"]))
          PY
          done
          exit $falhou

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exemplos-renderizados
          path: saida/
