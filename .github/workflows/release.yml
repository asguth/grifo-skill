name: Release

# Ao publicar uma tag vX.Y.Z: grava a versão em SKILL.md/plugin.json/marketplace.json
# (commit na main, se mudou), gera grifo-skill.zip só com a skill e cria a release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Gravar a versão da tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          python ferramentas/versao.py "$V"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: versão $V"
            git push origin main
          fi

      - name: Empacotar a skill
        run: cd skills && zip -r ../grifo-skill.zip grifo -x '*/__pycache__/*'

      - name: Notas da versão (seção do CHANGELOG)
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versão $V." > notas.md

      # A release pode já existir (criada pela interface do GitHub junto com a tag):
      # nesse caso só anexa/atualiza o zip; senão, cria a release com as notas do CHANGELOG.
      - name: Criar a release ou anexar o zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" grifo-skill.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" grifo-skill.zip --title "Grifo-Skill $GITHUB_REF_NAME" --notes-file notas.md
          fi
